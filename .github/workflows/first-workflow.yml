name: Full CI/CD Pipeline

on:
  push:

permissions:
  contents: read
  id-token: write   # keyless GCP auth (Workload Identity Federation)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/453073185656/locations/global/workloadIdentityPools/github-prod-2/providers/gh-goshh77
          service_account: wif-github-prod-demo@newprj-harsha.iam.gserviceaccount.com

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install GKE Auth Plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Configure Docker Authentication
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build Frontend Docker Image
        run: |
          docker build \
          -f Dockerfile.frontend \
          -t asia-south1-docker.pkg.dev/newprj-harsha/demo/frontend:v1 .

      - name: Push Frontend Docker Image
        run: |
          docker push \
          asia-south1-docker.pkg.dev/newprj-harsha/demo/frontend:v1

      - name: Build Backend Docker Image
        run: |
          docker build \
          -f Dockerfile.backend \
          -t asia-south1-docker.pkg.dev/newprj-harsha/demo/backend:v1 .

      - name: Push Backend Docker Image
        run: |
          docker push \
          asia-south1-docker.pkg.dev/newprj-harsha/demo/backend:v1

      - name: Connect to GKE Cluster
        run: |
          export USE_GKE_GCLOUD_AUTH_PLUGIN=True

          gcloud container clusters get-credentials demo-cluster \
          --region asia-south1 \
          --project newprj-harsha

      - name: Deploy to GKE
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/backend.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Verify Deployment
        run: |
          kubectl get pods -n project-dev
          kubectl get services -n project-dev